<header>
  <h1>Light The Night Totals</h1>
</header>
<section class="taskbar">
  <button (click)="toggleListView()">Switch to {{ (listView$ | async) ? 'list' : 'grid' }} view</button>
  <button (click)="refresh()">Refresh</button>
</section>
<section class="data" [ngClass]="{ grid: listView$ | async }">
  <app-thermometer *ngFor="let t of allData$ | async" [data]="t">
    <app-progress-bar *ngIf="loading$ | async" progress-bar></app-progress-bar>
  </app-thermometer>
</section>
